name: Build the macOS app
description: Builds the universal macOS app in desktop/release, signed and notarized. Runs on macOS after a checkout.

inputs:
  version:
    description: The app version. A leading v, as in a release tag, is dropped.
    required: true
  channel:
    description: Empty for a release, which updates from the GitHub releases. `canary` for a staging build, which updates from the canary release.
    required: false
    default: ''
  certificate:
    description: The Developer ID Application certificate and key, as a base64 .p12.
    required: true
  certificate-password:
    description: The password of the .p12.
    required: true
  api-key:
    description: The App Store Connect API key, the text of the .p8 file.
    required: true
  api-key-id:
    description: The ID of that key.
    required: true
  api-issuer:
    description: The issuer ID of the App Store Connect team.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install
      shell: bash
      working-directory: desktop
      run: |
        npm install -g npm@11.19.1
        npm ci --ignore-scripts

    - name: Use Xcode 26 for the Icon Composer icon
      shell: bash
      run: |
        xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner; actool needs it for build/Spotlight.icon."; exit 1; }
        sudo xcode-select -s "$xcode"
        xcrun actool --version | grep -A1 short-bundle-version

    - name: Set the version
      shell: bash
      working-directory: desktop
      env:
        VERSION: ${{ inputs.version }}
      run: npm version "${VERSION#v}" --no-git-tag-version

    - name: Write the notarization key
      shell: bash
      env:
        APPLE_API_KEY_P8: ${{ inputs.api-key }}
      run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

    - name: Build, sign and notarize
      shell: bash
      working-directory: desktop
      env:
        CSC_LINK: ${{ inputs.certificate }}
        CSC_KEY_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        APPLE_API_KEY_ID: ${{ inputs.api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.api-issuer }}
        SPOTLIGHT_DESKTOP_CHANNEL: ${{ inputs.channel }}
      run: npm run dist
