name: release

# release-please keeps a release pull request open on develop. Merging it tags
# the release and creates it as a draft. Once CI passes on that commit, this
# starts Build Images in usespotlightai/infrastructure, which builds the images
# with the tag as their version, uploads the spotlight binaries to the draft
# and publishes it.

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate a token for release-please
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  ci-passed:
    name: CI passed on the tagged commit
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the push workflows on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in control-plane.yml data-plane.yml web.yml gitleaks.yml codeql.yml; do
            while :; do
              run=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --workflow "$workflow" --event push --limit 1 \
                --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"' || true)
              case "$run" in
                "completed success") echo "$workflow passed"; break ;;
                completed*) echo "::error::$workflow did not pass on $SHA ($run)."; exit 1 ;;
                "") [ "$SECONDS" -lt 180 ] || { echo "::error::$workflow did not run on $SHA."; exit 1; } ;;
              esac
              sleep 30
            done
          done

  build-images:
    name: start the image build
    needs: [release-please, ci-passed]
    runs-on: ubuntu-latest
    steps:
      - name: Generate an infrastructure repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infrastructure

      - name: Start Build Images
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh workflow run build-images.yml \
            --repo "${{ github.repository_owner }}/infrastructure" \
            --ref main \
            -f ref="${TAG}"

          {
            echo "### ${TAG}"
            echo
            echo "Requested an image build in ${{ github.repository_owner }}/infrastructure."
          } >> "${GITHUB_STEP_SUMMARY}"
