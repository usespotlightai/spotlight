name: release

# release-please keeps a release pull request open on develop. Merging it tags
# the release and creates it as a draft. Once CI passes on that commit, this
# starts Build Images in usespotlightai/infrastructure, which builds the images
# with the tag as their version, uploads the spotlight binaries to the draft
# and publishes it. Before that starts, this builds, signs and notarizes the
# macOS app and uploads it, with the update feed the app reads, to the draft.

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate a token for release-please
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  ci-passed:
    name: CI passed on the tagged commit
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/wait-for-ci
        with:
          commit: ${{ github.sha }}
          token: ${{ github.token }}

  build-images:
    name: start the image build
    needs: [release-please, ci-passed, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Generate an infrastructure repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infrastructure

      - name: Start Build Images
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh workflow run build-images.yml \
            --repo "${{ github.repository_owner }}/infrastructure" \
            --ref main \
            -f ref="${TAG}"

          {
            echo "### ${TAG}"
            echo
            echo "Requested an image build in ${{ github.repository_owner }}/infrastructure."
          } >> "${GITHUB_STEP_SUMMARY}"

  desktop:
    name: build the macOS app
    needs: [release-please, ci-passed]
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/build-desktop-app
        with:
          version: ${{ needs.release-please.outputs.tag }}
          certificate: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml

          {
            echo "### Spotlight for macOS ${TAG}"
            echo
            echo "Uploaded the signed and notarized app to the release."
          } >> "${GITHUB_STEP_SUMMARY}"
