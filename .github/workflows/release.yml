name: release

# release-please keeps a release pull request open on develop. Merging it tags
# the release and creates it as a draft. Once CI passes on that commit, this
# starts Build Images in usespotlightai/infrastructure, which builds the images
# with the tag as their version, uploads the spotlight binaries to the draft
# and publishes it. Before that starts, this builds, signs and notarizes the
# macOS app and uploads it, with the update feed the app reads, to the draft.

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate a token for release-please
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  ci-passed:
    name: CI passed on the tagged commit
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the push workflows on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in control-plane.yml data-plane.yml web.yml desktop.yml gitleaks.yml codeql.yml; do
            while :; do
              run=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --workflow "$workflow" --event push --limit 1 \
                --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"' || true)
              case "$run" in
                "completed success") echo "$workflow passed"; break ;;
                completed*) echo "::error::$workflow did not pass on $SHA ($run)."; exit 1 ;;
                "") [ "$SECONDS" -lt 180 ] || { echo "::error::$workflow did not run on $SHA."; exit 1; } ;;
              esac
              sleep 30
            done
          done

  build-images:
    name: start the image build
    needs: [release-please, ci-passed, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Generate an infrastructure repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infrastructure

      - name: Start Build Images
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh workflow run build-images.yml \
            --repo "${{ github.repository_owner }}/infrastructure" \
            --ref main \
            -f ref="${TAG}"

          {
            echo "### ${TAG}"
            echo
            echo "Requested an image build in ${{ github.repository_owner }}/infrastructure."
          } >> "${GITHUB_STEP_SUMMARY}"

  desktop:
    name: build the macOS app
    needs: [release-please, ci-passed]
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: |
          npm install -g npm@11.19.1
          npm ci --ignore-scripts

      - name: Use Xcode 26 for the Icon Composer icon
        working-directory: .
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner; actool needs it for build/Spotlight.icon."; exit 1; }
          sudo xcode-select -s "$xcode"
          xcrun actool --version | grep -A1 short-bundle-version

      - name: Set the version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version

      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml

          {
            echo "### Spotlight for macOS ${TAG}"
            echo
            echo "Uploaded the signed and notarized app to the release."
          } >> "${GITHUB_STEP_SUMMARY}"
