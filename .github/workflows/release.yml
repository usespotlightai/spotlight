name: release

on:
  push:
    tags:
      - "**"
      # Do not start a build for a commit tag. Build Images makes these tags for staging.
      - "![0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-passed:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the push workflows on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in control-plane.yml data-plane.yml web.yml gitleaks.yml codeql.yml; do
            while :; do
              run=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --workflow "$workflow" --event push --limit 1 \
                --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"' || true)
              case "$run" in
                "completed success") echo "$workflow passed"; break ;;
                completed*) echo "::error::$workflow did not pass on $SHA ($run)."; exit 1 ;;
                "") [ "$SECONDS" -lt 180 ] || { echo "::error::$workflow did not run on $SHA. Tag a commit on develop or main."; exit 1; } ;;
              esac
              sleep 30
            done
          done

  build-images:
    name: start the image build
    needs: ci-passed
    runs-on: ubuntu-latest
    steps:
      - name: Generate an infrastructure repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infrastructure

      - name: Start Build Images
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run build-images.yml \
            --repo "${{ github.repository_owner }}/infrastructure" \
            --ref main \
            -f ref="${TAG}"

          {
            echo "### ${TAG}"
            echo
            echo "Requested an image build in ${{ github.repository_owner }}/infrastructure."
          } >> "${GITHUB_STEP_SUMMARY}"
