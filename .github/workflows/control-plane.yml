name: control-plane

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint, format, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --wait control-plane

      - name: OpenAPI spec is up to date
        run: |
          docker compose exec -T control-plane npm run openapi:generate
          git diff --exit-code -- control-plane/openapi.json \
            || { echo "::error::openapi.json is stale. Run 'docker compose exec -T control-plane npm run openapi:generate'."; exit 1; }

      - name: Auth schema is up to date
        run: |
          rm control-plane/src/infrastructure/persistence/drizzle/auth.schema.ts
          docker compose exec -T control-plane npm run auth:generate
          git diff --exit-code -- control-plane/src/infrastructure/persistence/drizzle/auth.schema.ts \
            || { echo "::error::auth.schema.ts is stale. Run 'docker compose exec -T control-plane npm run auth:generate'."; exit 1; }

      - name: e2e tests
        run: docker compose exec -T control-plane npm run test:e2e

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
