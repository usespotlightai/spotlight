name: control-plane

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint, format, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install
        run: |
          npm install -g npm@11.19.1
          npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Unused code and dependencies
        run: npm run knip

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Generated files are up to date
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          BETTER_AUTH_SECRET: ci-better-auth-secret-not-a-real-one
          BETTER_AUTH_URL: http://localhost:3000
          SPOTLIGHT_SECRETS_KEY: S9+m23g9lI8X4VNFd0ayFXJH7P14Q3GZGsNvjCglc/Q=
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          GITHUB_APP_ID: ci
          GITHUB_APP_PRIVATE_KEY: ci
          S3_BUCKET: files
        run: |
          npm run openapi:generate
          npm run auth:generate
          git diff --exit-code -- openapi.json src/contexts/identity/infrastructure/persistence/drizzle/schemas/auth.schema.ts \
            || { echo "::error::Generated files are stale. Run 'npm run openapi:generate' and 'npm run auth:generate' in control-plane."; exit 1; }

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Postgres without durability
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET $setting"
          done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "SELECT pg_reload_conf()"

      - name: PgBouncer in transaction mode
        working-directory: .
        run: |
          docker build -q -t pgbouncer -f .docker/pgbouncer/Dockerfile .
          docker run -d --name pgbouncer --network host -e POSTGRES_HOST=127.0.0.1 pgbouncer
          for _ in $(seq 30); do
            docker run --rm --network host postgres:18.6-alpine \
              psql postgres://postgres:postgres@127.0.0.1:6432/postgres -c 'select 1' > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Install
        run: |
          npm install -g npm@11.19.1
          npm ci

      - uses: actions/cache@v6
        with:
          path: control-plane/node_modules/.vitest-cache
          key: vitest-e2e-${{ hashFiles('control-plane/package-lock.json') }}-${{ github.sha }}
          restore-keys: vitest-e2e-${{ hashFiles('control-plane/package-lock.json') }}-

      - name: e2e tests behind PgBouncer
        env:
          SPOTLIGHT_E2E_POOLER_URL: postgres://postgres:postgres@127.0.0.1:6432/postgres
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: PgBouncer logs
        if: failure()
        run: docker logs pgbouncer || true
