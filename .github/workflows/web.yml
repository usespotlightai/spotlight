name: web

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lint-and-test:
    name: web lint, format, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          npm install -g npm@11.19.1
          npm ci

      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api \
            || { echo "::error::src/lib/api is stale. Run 'npm run api:generate' in web/."; exit 1; }

      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and format check
        run: npx biome ci .

      - name: Unused code and dependencies
        run: npm run knip

      - name: React Doctor
        run: npm run doctor

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
