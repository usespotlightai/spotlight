version: 2

updates:
  - package-ecosystem: npm
    directory: /control-plane
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions: ["7.0.x"]
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /data-plane
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /.docker/control-plane
      - /.docker/runner
      - /.docker/web
      - /.docker/postgres
      - /.docker/traefik
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
