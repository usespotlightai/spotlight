root = "."
tmp_dir = "tmp"

[build]
  # Build, then mv. If you overwrite a binary that runs, the write fails with "text file busy".
  cmd = "go build -o /tmp/spotlight.next ./cmd/spotlight && mv /tmp/spotlight.next /tmp/spotlight"
  entrypoint = "/tmp/spotlight"
  args_bin = ["host"]
  include_dir = ["cmd", "host", "control", "protocol"]
  include_ext = ["go"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = false
  send_interrupt = true
  # This delay gives the host enough time to stop and destroy its sandboxes.
  kill_delay = "45s"
  # Docker Desktop stops the delivery of inotify events into the container.
  poll = true
  poll_interval = 500

[log]
  time = false

[misc]
  clean_on_exit = true
