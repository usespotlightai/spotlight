name: spotlight

x-control-plane-env: &control-plane-env
  NODE_ENV: development
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-xj4/EgMfb/oOOX54xSnrKiCToESDSWJIy4mLF5Sxlo/IUzvEd/hJDh9VT2kqsyeo}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://app.dev.usespotlight.ai}
  SPOTLIGHT_SECRETS_KEY: ${SPOTLIGHT_SECRETS_KEY:-3h+HUYiFyqYwqtMg1AXtsVO1pTcSprmLnsjvI18ksco=}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-slack.com}
  S3_BUCKET: ${S3_BUCKET:-files}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://dev.usespotlight.ai}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-spotlight}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-spotlight-storage}
  # The shared OAuth2 apps, per host, as JSON
  OAUTH_CLIENTS: ${OAUTH_CLIENTS:-}
  SMTP_URL: ${SMTP_URL:-smtp://mail:1025}
  MAIL_FROM: ${MAIL_FROM:-Spotlight <noreply@dev.usespotlight.ai>}
  LOG_LEVEL: ${LOG_LEVEL:-debug}

x-runner-env: &runner-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  SPOTLIGHT_URL: ${SPOTLIGHT_URL:-http://control-plane:3000}
  SPOTLIGHT_WORKSPACE: /workspaces
  SPOTLIGHT_AGENT_USER: agent
  SPOTLIGHT_PREPARE_HOOK: /etc/spotlight/hooks/prepare
  SPOTLIGHT_GIT_AUTHOR_NAME: ${SPOTLIGHT_GIT_AUTHOR_NAME:-Spotlight}
  SPOTLIGHT_GIT_AUTHOR_EMAIL: ${SPOTLIGHT_GIT_AUTHOR_EMAIL:-noreply@usespotlight.ai}

x-runner: &runner
  image: spotlight-runner
  build:
    context: .
    dockerfile: .docker/runner/Dockerfile
    target: development
  restart: unless-stopped
  depends_on:
    control-plane:
      condition: service_healthy

services:
  traefik:
    build:
      context: .
      dockerfile: .docker/traefik/Dockerfile
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.http.address=:80
      - --entryPoints.http.http.redirections.entryPoint.to=https
      - --entryPoints.http.http.redirections.entryPoint.scheme=https
      - --entryPoints.https.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --ping=true
      - --accesslog=true
      - --accesslog.format=json
      - --tracing=true
      - --api.dashboard=true
      - --api.insecure=true
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./.docker/traefik/certs:/etc/traefik/certs:ro

  # Publishes app-dev.usespotlight.ai/api/webhooks so GitHub can reach a
  # control plane that is otherwise only on this machine.
  tunnel:
    build:
      context: .
      dockerfile: .docker/tunnel/Dockerfile
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      control-plane:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: .docker/control-plane/Dockerfile
      target: migrate
    environment: *control-plane-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./control-plane:/app
      - node-modules-migrate:/app/node_modules

  control-plane:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/control-plane/Dockerfile
      target: development
    environment: *control-plane-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.control-plane.rule=Host(`app.dev.usespotlight.ai`) && PathPrefix(`/api`)"
      - traefik.http.routers.control-plane.entrypoints=https
      - traefik.http.routers.control-plane.tls=true
      - traefik.http.services.control-plane.loadbalancer.server.port=3000
    volumes:
      - ./control-plane:/app
      - ./installer:/opt/spotlight/installer:ro
      - node-modules-control-plane:/app/node_modules

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: development
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "5173:5173"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.web.rule=Host(`app.dev.usespotlight.ai`)"
      - traefik.http.routers.web.entrypoints=https
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=5173
    volumes:
      - ./web:/app
      - ./control-plane/openapi.json:/control-plane/openapi.json:ro
      - node-modules-web:/app/node_modules

  runner-1:
    <<: *runner
    environment:
      <<: *runner-env
      SPOTLIGHT_TOKEN: ${RUNNER_ONE_TOKEN:-}
    volumes:
      - ./runner:/app
      - runner-1-workspaces:/workspaces
      - runner-1-agent:/home/agent

  runner-2:
    <<: *runner
    environment:
      <<: *runner-env
      SPOTLIGHT_TOKEN: ${RUNNER_TWO_TOKEN:-}
    volumes:
      - ./runner:/app
      - runner-2-workspaces:/workspaces
      - runner-2-agent:/home/agent

  mail:
    build:
      context: .
      dockerfile: .docker/mail/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "8025:8025"
    volumes:
      - mail-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"

  storage:
    build:
      context: .
      dockerfile: .docker/storage/Dockerfile
      target: storage
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-spotlight}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-spotlight-storage}
      MINIO_DOMAIN: ${S3_PUBLIC_DOMAIN:-dev.usespotlight.ai}
      MINIO_API_CORS_ALLOW_ORIGIN: https://app.dev.usespotlight.ai
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - "traefik.http.routers.storage.rule=Host(`${S3_BUCKET:-files}.dev.usespotlight.ai`)"
      - traefik.http.routers.storage.entrypoints=https
      - traefik.http.routers.storage.tls=true
      - traefik.http.services.storage.loadbalancer.server.port=9000
    volumes:
      - storage-data:/data

  storage-bucket:
    build:
      context: .
      dockerfile: .docker/storage/Dockerfile
      target: bucket
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-spotlight}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-spotlight-storage}
      S3_BUCKET: ${S3_BUCKET:-files}

  db:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  runner-1-workspaces:
  runner-2-workspaces:
  runner-1-agent:
  runner-2-agent:
  node-modules-web:
  node-modules-migrate:
  node-modules-control-plane:
  db-data:
  storage-data:
  mail-data:
