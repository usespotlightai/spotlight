name: spotlight

services:
  control-plane:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/control-plane/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    ports:
      - "3000:3000"
    volumes:
      - ./control-plane:/app
      - node-modules-control-plane:/app/node_modules

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: development
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - node-modules-web:/app/node_modules

  db:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  node-modules-web:
  node-modules-control-plane:
  db-data:
